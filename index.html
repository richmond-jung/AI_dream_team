<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생명과학 HR담당 AI 드림팀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a1a;
  --muted:#6b6b6b;
  --line:#e5e5e5;
  --soft:#f5f5f5;
  --paper:#ffffff;
  --red:#a50034;
  --red-d:#82002a;
  --focus:#a50034;
  --font:'LG Smart','LG Smart UI','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:57px;padding:0 28px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.02rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none;border-left:4px solid var(--red);padding-left:10px;line-height:1.15}
.ghost-btn{background:var(--paper);border:1px solid #cfcfcf;border-radius:999px;padding:7px 18px;font-size:.88rem;font-weight:500;cursor:pointer}
.ghost-btn:hover{border-color:var(--ink)}

/* catalog */
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.hero{padding:60px 0 24px}
.hero h1{font-weight:700;font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.2;margin:0 0 12px;letter-spacing:-.025em}
.hero p{margin:0;color:var(--muted);font-size:1.02rem;max-width:56ch}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 0 28px}
.search{flex:1 1 300px;max-width:380px;padding:10px 18px;border:1px solid transparent;border-radius:999px;background:var(--soft)}
.search:focus{background:#fff;border-color:#cfcfcf}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #cfcfcf;background:var(--paper);border-radius:999px;padding:7px 15px;font-size:.88rem;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip small{opacity:.7;margin-left:5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:20px;padding-bottom:72px}
.badge{--c:#a50034;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:26px 20px 18px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.badge:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.09)}
.avatar{position:relative;width:96px;height:96px;margin:0 auto 14px;border-radius:50%;overflow:hidden;background:var(--soft)}
.avatar svg{display:block;width:100%;height:100%}
.dept{text-align:center;color:var(--c);font-size:.78rem;font-weight:700;margin-bottom:4px}
.name{text-align:center;font-weight:700;font-size:1.08rem;line-height:1.35;letter-spacing:-.01em}
.desc{text-align:center;color:var(--muted);font-size:.86rem;line-height:1.55;margin:8px 0 18px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--line);font-size:.88rem}
.price{font-weight:700}
.go{font-weight:600;color:var(--red)}
.empty{grid-column:1/-1;padding:40px 0;color:var(--muted)}

/* chat */
.chat{display:grid;grid-template-columns:320px 1fr;height:calc(100dvh - 57px)}
.side{padding:24px;border-right:1px solid var(--line);overflow:auto;background:var(--soft)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:.9rem;font-weight:500;color:var(--muted);cursor:pointer;text-decoration:none}
.back:hover{color:var(--red)}
.side .avatar{width:120px;height:120px;margin:22px 0 14px;background:#fff}
.side h2{font-weight:700;font-size:1.4rem;line-height:1.3;letter-spacing:-.02em;margin:0 0 8px}
.pill{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:2px 12px;font-size:.78rem;font-weight:600}
.cost{margin-left:8px;font-size:.85rem;font-weight:700;color:var(--ink)}
.side p{color:var(--muted);font-size:.92rem;margin:12px 0}
.side h3{font-size:.9rem;margin:20px 0 6px}
.side ul{margin:0;padding-left:18px;font-size:.9rem}
.side li{margin-bottom:3px}
.mobile-back{display:none}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;max-width:760px;width:100%}
.row.user{align-self:flex-end;justify-content:flex-end}
.row .mini{flex:0 0 34px;width:34px;height:34px;margin-top:2px}
.mini .avatar{width:34px;height:34px;margin:0}
.bubble{padding:11px 16px;border-radius:16px;max-width:100%;overflow-wrap:anywhere;font-size:.96rem}
.row.agent .bubble{background:var(--soft);border-top-left-radius:4px}
.row.user .bubble{background:var(--red);color:#fff;border-top-right-radius:4px;white-space:pre-wrap}
.bubble p{margin:0 0 .6em}
.bubble p:last-child,.bubble ul:last-child,.bubble ol:last-child{margin-bottom:0}
.bubble h4{margin:.9em 0 .3em;font-size:.98rem}
.bubble h4:first-child{margin-top:0}
.bubble ul,.bubble ol{margin:0 0 .6em;padding-left:1.3em}
.bubble li{margin-bottom:.2em}
.bubble code{background:#fff;padding:1px 5px;border-radius:4px;font-size:.9em}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0 44px}
.starter{background:#fff;border:1px solid #cfcfcf;border-radius:14px;padding:8px 14px;font-size:.88rem;text-align:left;cursor:pointer}
.starter:hover{border-color:var(--red);color:var(--red)}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.notice{align-self:center;max-width:620px;background:#fff4e6;border:1px solid #ffd8a8;color:#7c3d00;border-radius:12px;padding:10px 16px;font-size:.9rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice button{background:#7c3d00;color:#fff;border:0;border-radius:999px;padding:4px 14px;font-size:.84rem;cursor:pointer}
.composer{display:flex;gap:10px;align-items:flex-end;padding:14px clamp(16px,4vw,48px) 18px;border-top:1px solid var(--line);background:var(--paper)}
.composer textarea{flex:1;resize:none;max-height:160px;padding:11px 18px;border:1px solid #cfcfcf;border-radius:20px;background:#fff;line-height:1.5}
.send{background:var(--red);color:#fff;border:0;border-radius:999px;padding:11px 24px;font-weight:600;cursor:pointer}
.send:hover{background:var(--red-d)}
.send:disabled{opacity:.35;cursor:not-allowed}

.badge.custom{border-style:dashed;border-top-style:dashed;background:transparent}
.cf{max-width:640px;margin:0 auto;padding:0 28px 64px}
.cf label{display:block;font-weight:600;font-size:.92rem;margin:18px 0 4px}
.cf .hint{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:6px}
.cf input,.cf textarea{width:100%;padding:10px 14px;border:1px solid #cfcfcf;border-radius:12px;background:#fff}
.cf textarea{min-height:130px;resize:vertical}
.cf .actions{display:flex;gap:10px;align-items:center;margin-top:24px}

/* settings dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 32px));color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:26px}
.dlg h2{font-weight:700;font-size:1.3rem;letter-spacing:-.02em;margin:0 0 14px}
.dlg label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
.dlg .hint{font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
.dlg input,.dlg textarea{width:100%;padding:9px 12px;border:1px solid #cfcfcf;border-radius:10px;background:#fff}
.dlg textarea{min-height:110px;resize:vertical}
.dlg .actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.dlg .actions div{display:flex;gap:10px}
.danger{color:#c92a2a;border-color:#ffc9c9}

@media (max-width:820px){
  .chat{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:flex;align-items:center;gap:14px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .side .avatar{width:48px;height:48px;margin:0;flex:none}
  .side .more{display:none}
  .side .head{flex:1;min-width:0}
  .side h2{font-size:1.1rem;margin:0}
  .side .desc-m{display:none}
  .mobile-back{display:inline-flex}
  .hero{padding-top:36px}
}
@media (prefers-reduced-motion:reduce){
  .badge,.badge:hover{transition:none;transform:none}
  .dots i{animation:none;opacity:.6}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">생명과학 HR담당 AI 드림팀</a>
  <button class="ghost-btn" id="openSettings" type="button">설정</button>
</header>

<main id="app"></main>

<dialog id="settings">
  <form method="dialog" class="dlg" id="settingsForm">
    <h2>설정</h2>
    <label for="sKey">Gemini API 키
      <div class="hint">이 브라우저에만 저장돼요. 프록시 주소를 입력하면 키는 필요 없어요.</div>
    </label>
    <input id="sKey" type="password" autocomplete="off" placeholder="AIza...">
    <label for="sModel">모델 이름
      <div class="hint">예: gemini-2.5-flash. 사용 가능한 모델명은 Google AI Studio에서 확인하세요.</div>
    </label>
    <input id="sModel" type="text" autocomplete="off">
    <label for="sProxy">프록시 주소 (선택)
      <div class="hint">서버를 거쳐 호출할 때 입력해요. 요청은 Gemini generateContent 형식 그대로 전달돼요.</div>
    </label>
    <input id="sProxy" type="url" autocomplete="off" placeholder="https://내-서버/api/gemini">
    <label for="sScenario">현재 시나리오 브리핑 (선택)
      <div class="hint">입력하면 모든 전문가가 이 상황을 알고 답해요. 레벨이 바뀔 때 교체하세요.</div>
    </label>
    <textarea id="sScenario" placeholder="예: 경쟁사가 우리 연구소 인근에 신규 연구소를 세우고 핵심 연구원 스카우트를 시작했습니다."></textarea>
    <div class="actions">
      <button class="ghost-btn danger" type="button" id="clearChats">모든 대화 지우기</button>
      <div>
        <button class="ghost-btn" type="button" id="cancelSettings">닫기</button>
        <button class="send" type="submit" value="save">저장</button>
      </div>
    </div>
  </form>
</dialog>

<script>
/* =========================================================
   1. 기본 설정 (사내 배포 시 여기 값을 직접 넣어도 됩니다)
   ========================================================= */
const DEFAULTS = {
  apiKey: '',                    // Gemini API 키 (비워두면 설정 창에서 입력)
  model: 'gemini-2.5-flash',     // 사용할 Gemini 모델명
  proxyUrl: '',                  // 서버 프록시를 쓸 경우 주소
  scenario: ''                   // 모든 전문가에게 공통으로 전달할 시나리오 브리핑
};

/* =========================================================
   2. 전문가 16인
   ========================================================= */
const DEPTS = {
  biz:    { name: '사업·R&D 인사이트',   color: '#3d5a80' },
  talent: { name: '인재 확보·승계·보상', color: '#a50034' },
  ops:    { name: '조직·인력 운영',      color: '#7d7873' },
  legal:  { name: '노무·법무·규제',      color: '#2b2b2b' },
  change: { name: '변화·소통·위기',      color: '#2f7f7a' },
  custom: { name: '직접 설계',           color: '#555555' }
};

const L = (skin, hair, hc, shirt, glasses) => ({ skin, hair, hc, shirt, glasses });

const AGENTS = [
  /* ---------- 사업·R&D 인사이트 ---------- */
  { id:'pipeline', dept:'biz', price:25, name:'파이프라인·임상개발 전략가',
    desc:'임상 결과를 해석하고 파이프라인 우선순위를 다시 잡아요.',
    skills:['임상 실패 원인과 후속 옵션 정리','파이프라인 우선순위 재조정','프로그램별 필요 인력 규모 추정'],
    starters:['임상 3상 실패 후 파이프라인을 어떻게 재조정할 수 있을까요?','재배치할 연구인력이 옮겨 갈 수 있는 프로그램을 알려 주세요.'],
    look:L('#f2c9a5','short','#1f1a17','#364fc7',false),
    role:'제약·바이오 R&D 포트폴리오와 임상개발 전략 전문가. 임상 결과에 따른 후속 옵션(적응증 확장, 병용, 라이선스 아웃, 중단 등)과 파이프라인 재조정을 다룬다.',
    how:'프로그램을 유지/확대/중단 옵션으로 나누고, 옵션마다 필요한 연구인력 직군과 규모를 함께 추정한다. 구체 수치는 가정으로 밝히고 임상 데이터의 세부는 지어내지 않는다.',
    format:'상황 판단 / 후속 옵션 / 옵션별 인력 영향 / 확인 필요 사항' },

  { id:'competitor', dept:'biz', price:15, name:'제약 경쟁 인텔리전스',
    desc:'경쟁사의 연구소 설립과 인재 영입 움직임을 읽어요.',
    skills:['경쟁사 R&D 거점·투자 의도 해석','업계 스카우트 관행 파악','경쟁사 인재 영입 패턴 분석'],
    starters:['경쟁사가 우리 근처에 연구소를 세우는 의도가 뭘까요?','스카우트 대상이 될 가능성이 높은 인력군을 짚어 주세요.'],
    look:L('#e3b08a','bob','#3b2a20','#4263eb',true),
    role:'제약·바이오 업계 경쟁사의 R&D 전략과 인재 이동 동향을 분석하는 경쟁 인텔리전스 전문가. 실시간 검색은 할 수 없으므로 업계의 일반적인 패턴 중심으로 답한다.',
    how:'알려진 패턴과 추정을 구분한다. 출처를 알 수 없는 수치와 특정 회사의 내부 사정은 지어내지 않고 [확인 필요]로 표시한다.',

  { id:'trend', dept:'biz', price:20, name:'신약개발 트렌드 분석가',

    skills:['AI 신약개발·신규 모달리티 동향','앞으로 늘고 줄 직무','필요 역량 변화 전망'],
    starters:['2030년에 신약개발에서 가장 크게 달라질 점은 뭔가요?','앞으로 수요가 늘 직무와 줄어들 직무를 알려 주세요.'],
    look:L('#f6d5b8','long','#2b2f3a','#3b5bdb',true),
    role:'신약개발 기술 트렌드(AI 기반 신약개발, 신규 모달리티, 디지털 임상, 실험 자동화 등)와 그에 따른 연구인력 역량 변화를 분석하는 전문가.',
    how:'확정된 사실과 전망을 구분하고 불확실성을 밝힌다. 영향 시점(단기/중기)과 직무에 미치는 영향 중심으로 정리한다.',

  { id:'finance', dept:'biz', price:20, name:'R&D 인건비·재무 분석가',
    desc:'인건비와 리텐션·통합 비용을 가정으로 추정해요.',
    skills:['인건비·제도 변경 비용 추정','낙관/기준/보수 시나리오','예산 대비 효과 비교'],
    starters:['연구인력 120명 재배치에 드는 비용을 대략 추정해 주세요.','리텐션 보너스를 이 규모로 주면 비용이 얼마나 들까요?'],
    look:L('#c98f66','short','#1f1a17','#2f3a5f',false),
    role:'R&D 인건비와 인력 관련 투자의 비용·효과를 추정하는 재무 분석가.',
    how:'실제 수치를 모르면 가정을 목록으로 먼저 밝힌 뒤 계산한다. 낙관/기준/보수 3가지 케이스로 범위를 보여 주고 계산 과정을 짧게 드러낸다.',
    format:'가정 / 비용 추정(3케이스) / 판단 포인트 / 확인 필요 항목' },

  { id:'analytics', dept:'biz', price:15, name:'HR 애널리틱스 분석가',
    desc:'이직률·역량 같은 인력 데이터를 해석하고 필요한 지표를 짚어요.',
    skills:['이직 위험 신호와 지표','인력 현황 진단 프레임','추가로 필요한 데이터 제안'],
    starters:['핵심 연구원의 이직 위험을 볼 지표를 골라 주세요.','판단하려면 어떤 데이터가 더 필요할까요?'],

  return c ? { id:'custom', dept:'custom', price:'', name:c.name, role:c.role, how:c.how || '', format:'',
    desc:'우리 팀이 직접 설계한 전문가예요.', skills:[], starters:[], look:'robot' } : null;
}

/* =========================================================
   3. 저장소 (설정은 localStorage, 대화는 sessionStorage)
   ========================================================= */
const store = {
  get(area, k, d){ try{ const v = window[area].getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(area, k, v){ try{ window[area].setItem(k, JSON.stringify(v)); }catch(e){} }
};
function getSettings(){
  const saved = store.get('localStorage','hras.settings',{});
  const s = {...DEFAULTS};
  Object.keys(saved).forEach(k => { if(saved[k] !== '' && saved[k] != null) s[k] = saved[k]; });
  return s;
}
let chats = store.get('sessionStorage','hras.chats',{});
const saveChats = () => store.set('sessionStorage','hras.chats',chats);

   4. Gemini 연동
   ========================================================= */
class NoKeyError extends Error {}

function buildSystemPrompt(agent){
  const team = AGENTS.filter(a => a.id !== agent.id).map(a => a.name).join(', ');
  const scenario = getSettings().scenario;
  const parts = [
    "당신은 제약회사 HR 부서 워크샵의 'AI 전문가 팀원'입니다. 참가자(HR 담당자)가 연구개발 중심 제약회사의 가상 경영 이슈를 풀 때 곁에서 돕습니다.",
    "",
    "# 공통 원칙",
    "- 한국어로 답한다. 실제 회사나 개인 정보가 아닌 가상 상황으로 다룬다.",
    "- 결론을 먼저 말하고, 근거와 다음 행동을 잇는다. 기본 답변은 짧고 밀도 있게(약 400~700자), 요청하면 더 자세히 쓴다.",
    "- 마크다운 소제목과 불릿은 써도 되지만 표는 쓰지 않는다.",
    "- 근거 없는 수치나 사실을 지어내지 않는다. 가정은 '가정:'으로 밝히고, 확인이 필요한 것은 [확인 필요]로 표시한다.",
    "- 질문이 모호하면 가장 그럴듯한 가정으로 먼저 답하고, 필요한 확인 질문은 마지막에 1개만 한다.",
    "- 자신의 전문 영역 밖의 질문이면 아래 팀원 중 누구에게 물으면 좋을지 알려 준다. 팀원: " + team,
    "- 최종 판단은 참가자가 한다. 선택지와 트레이드오프를 보여 주되 결정을 대신하지 않는다.",
    "",
    "# 당신의 역할: " + agent.name,
    agent.role
  ];
  if (agent.how)    parts.push("", "# 일하는 방식", agent.how);
  if (agent.format) parts.push("", "# 답변 형식(요청이 단순하면 유연하게 줄여도 됨)", agent.format);
  if (scenario)     parts.push("", "# 현재 시나리오 브리핑", scenario);
  return parts.join("\n");
}

async function askGemini(agent, history){
  const s = getSettings();
  const body = {
    systemInstruction: { parts: [{ text: buildSystemPrompt(agent) }] },
    contents: history.map(m => ({ role: m.role, parts: [{ text: m.text }] })),
    generationConfig: { temperature: 0.7 }
  };
  const headers = { 'Content-Type': 'application/json' };
  let url;
  if (s.proxyUrl){
    url = s.proxyUrl;
    body.model = s.model;                      // 프록시가 모델을 고르도록 함께 전달
  } else {
    if (!s.apiKey) throw new NoKeyError();
    url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(s.model) + ':generateContent';
    headers['x-goog-api-key'] = s.apiKey;
  }
  const res = await fetch(url, { method:'POST', headers, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || ('요청에 실패했어요 (' + res.status + ')'));
  const cand = data.candidates && data.candidates[0];
  const text = cand && cand.content && cand.content.parts ? cand.content.parts.map(p => p.text || '').join('') : '';
  if (!text) throw new Error('응답이 비어 있어요. 질문을 조금 바꿔서 다시 보내 보세요.');
  return text;
}

    <path d="M53 65Q60 70 67 65" stroke="#1c2340" stroke-width="2" fill="none" stroke-linecap="round"/>
    ${glass}
  </svg>`;
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(text){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  let html = '', list = null, m;
  const close = () => { if(list){ html += '</' + list + '>'; list = null; } };
  for (const raw of text.split('\n')){
    const line = raw.trimEnd();
    if (!line.trim()){ close(); continue; }
    if ((m = line.match(/^#{1,4}\s+(.*)/))){ close(); html += '<h4>' + inline(m[1]) + '</h4>'; }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))){ if(list !== 'ul'){ close(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))){ if(list !== 'ol'){ close(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; }
    else { close(); html += '<p>' + inline(line) + '</p>'; }
  }
  close();
  return html;
}

/* =========================================================
   6. 화면: 포트폴리오(카탈로그)
   ========================================================= */
const app = document.getElementById('app');
let filter = 'all', query = '', current = null, pending = null, notice = null;

function renderCatalog(){
  current = null;
  document.title = '생명과학 HR담당 AI 드림팀';
  const count = k => k === 'all' ? AGENTS.length : AGENTS.filter(a => a.dept === k).length;
  app.innerHTML = `
    <div class="wrap">
      <section class="hero">
        <h1>AI 전문가 팀원 ${AGENTS.length}인</h1>
        <p>함께 일할 전문가를 골라 클릭하면 1:1 채팅이 열려요. 카드에 적힌 코인은 고용 비용이에요.</p>
      </section>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="전문가 검색 (예: 노무, 보고서)" aria-label="전문가 검색" value="${esc(query)}">
        <div class="chips" role="group" aria-label="분야 필터">
          ${[['all','전체'], ...Object.entries(DEPTS).filter(([k]) => k !== 'custom').map(([k,v]) => [k,v.name])].map(([k,n]) =>
            `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter===k}">${n}<small>${count(k)}</small></button>`).join('')}
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>`;
  drawGrid();
  document.getElementById('q').addEventListener('input', e => { query = e.target.value; drawGrid(); });
  app.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f;
    app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.f === filter)));
    drawGrid();
  }));
}

function drawGrid(){
  const q = query.trim().toLowerCase();
  const list = AGENTS.filter(a =>
    (filter === 'all' || a.dept === filter) &&
    (!q || (a.name + a.desc + a.skills.join(' ') + DEPTS[a.dept].name).toLowerCase().includes(q)));
  let html = list.map(a => {
    const d = DEPTS[a.dept];
    return `<a class="badge" href="#/agent/${a.id}" style="--c:${d.color}" aria-label="${a.name}와 채팅하기, 고용 비용 ${a.price}코인">
      <div class="avatar">${avatarSVG(a)}</div>
      <div class="dept">${d.name}</div>
      <div class="name">${a.name}</div>
      <div class="desc">${a.desc}</div>
      <div class="foot"><span class="price">${a.price}코인</span><span class="go">채팅 시작</span></div>
    </a>`;
  }).join('');
  if (filter === 'all' && !q){
    const c = getCustom(), d = DEPTS.custom;
    html += `<a class="badge custom" href="${c ? '#/agent/custom' : '#/custom'}" style="--c:${d.color}">
      <div class="avatar">${avatarSVG(c || {look:'robot'})}</div>
      <div class="dept">${d.name}</div>
      <div class="name">${c ? esc(c.name) : '우리 팀만의 전문가'}</div>
      <div class="desc">${c ? c.desc : '역할과 일하는 방식을 프롬프트로 직접 써서 전문가를 만들어요.'}</div>
      <div class="foot"><span></span><span class="go">${c ? '채팅 시작' : '전문가 만들기'}</span></div>
    </a>`;
  }
  document.getElementById('grid').innerHTML = html || '<div class="empty">조건에 맞는 전문가가 없어요. 다른 키워드로 검색하거나 필터를 바꿔 보세요.</div>';
}

/* =========================================================
   7. 화면: 전문가 채팅
   ========================================================= */
function renderChat(a){
  current = a;
  const d = DEPTS[a.dept];
  document.title = a.name + ' · 생명과학 HR담당 AI 드림팀';
  app.innerHTML = `
    <div class="chat" style="--c:${d.color}">
      <aside class="side">
        <div class="more"><a class="back" href="#/">‹ 전문가 목록</a></div>
        <div class="avatar">${avatarSVG(a)}</div>
        <div class="head">
          <h2>${a.name}</h2>
          <span class="pill">${d.name}</span>${a.price ? `<span class="cost">${a.price}코인</span>` : ''}
          <p class="desc-m">${a.desc}</p>
        </div>
        <div class="more">
          ${a.skills.length ? `<h3>잘하는 일</h3><ul>${a.skills.map(s => '<li>' + s + '</li>').join('')}</ul>` : ''}
          ${a.id === 'custom' ? '<h3>내가 만든 전문가</h3><a class="back" href="#/custom">이름·프롬프트 수정</a>' : ''}
        </div>
        <a class="back mobile-back" href="#/">‹ 목록</a>
      </aside>
      <section class="pane">
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="${a.name}에게 물어보세요" aria-label="메시지 입력"></textarea>
          <button class="send" id="send" type="submit" disabled>보내기</button>
        </form>
      </section>
    </div>`;

  const input = document.getElementById('input'), send = document.getElementById('send');
  const sync = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    send.disabled = !input.value.trim() || !!pending;
  };
  input.addEventListener('input', sync);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){
      e.preventDefault();
      document.getElementById('form').requestSubmit();
    }
  });
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const t = input.value;
    if (!t.trim() || pending) return;
    input.value = ''; sync();
    sendMessage(a, t);
  });
  drawMsgs(a);
  input.focus();
}

function drawMsgs(a){
  const box = document.getElementById('msgs');
  if (!box) return;
  const list = chats[a.id] || [];
  const mini = `<div class="mini"><div class="avatar">${avatarSVG(a)}</div></div>`;
  let html = '';
  if (!list.length){
    html += `<div class="row agent">${mini}<div class="bubble"><p>안녕하세요, ${a.name}입니다. ${a.desc}</p><p>지금 풀고 있는 이슈를 편하게 말씀해 주세요.</p></div></div>
      ${a.starters.length ? `<div class="starters">${a.starters.map(s => `<button class="starter" type="button">${s}</button>`).join('')}</div>` : ''}`;
  }
  list.forEach(m => {
    html += m.role === 'user'
      ? `<div class="row user"><div class="bubble">${esc(m.text)}</div></div>`
      : `<div class="row agent">${mini}<div class="bubble">${md(m.text)}</div></div>`;
  });
  if (pending === a.id) html += `<div class="row agent">${mini}<div class="bubble"><span class="dots" aria-label="답변 작성 중"><i></i><i></i><i></i></span></div></div>`;
  if (notice && notice.agent === a.id){
    html += `<div class="notice" role="alert"><span>${esc(notice.text)}</span>${notice.settings ? '<button type="button" data-open-settings>설정 열기</button>' : ''}</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('.starter').forEach(b => b.addEventListener('click', () => sendMessage(a, b.textContent)));
  box.querySelectorAll('[data-open-settings]').forEach(b => b.addEventListener('click', openSettings));
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(a, text){
  text = text.trim();
  if (!text || pending) return;
  const list = (chats[a.id] = chats[a.id] || []);
  list.push({ role:'user', text });
  pending = a.id; notice = null;
  saveChats(); drawMsgs(a);
  let failed = false;
  try {
    const reply = await askGemini(a, list);
    list.push({ role:'model', text: reply });
  } catch (err) {
    failed = true;
    list.pop();   // 실패한 질문은 기록에서 빼고 입력창에 되돌려 놓는다
    notice = err instanceof NoKeyError
      ? { agent:a.id, settings:true, text:'Gemini API 키가 아직 없어요. 설정에서 키를 입력하면 대화할 수 있어요.' }
      : { agent:a.id, settings:false, text:'답변을 받지 못했어요: ' + err.message + ' 입력한 내용은 그대로 두었으니 다시 보내 보세요.' };
  } finally {
    pending = null;
    saveChats();
    if (current && current.id === a.id){
      drawMsgs(a);
      const input = document.getElementById('input');
      if (failed && input){ input.value = text; input.dispatchEvent(new Event('input')); }
      if (input) input.focus();
    }
  }
}

/* =========================================================
   7-2. 화면: 우리 팀만의 전문가 만들기
   ========================================================= */
function renderCustomForm(){
  current = null;
  document.title = '전문가 만들기 · 생명과학 HR담당 AI 드림팀';
  const c = store.get('localStorage','hras.custom',{}) || {};
  app.innerHTML = `
    <div class="wrap"><section class="hero">
      <a class="back" href="#/">‹ 전문가 목록</a>
      <h1 style="margin-top:14px">우리 팀만의 전문가 만들기</h1>
      <p>역할과 일하는 방식을 직접 써 주세요. 한국어 답변, 지어내지 않기 같은 공통 원칙은 자동으로 적용돼요.</p>
    </section></div>
    <form class="cf" id="cf">
      <label for="cName">전문가 이름</label>
      <input id="cName" required maxlength="30" placeholder="예: 미래 직무 설계자" value="${esc(c.name || '')}">
      <label for="cRole">역할과 전문성 <span class="hint">어떤 분야의 전문가인지, 무엇을 잘 아는지 적어 주세요.</span></label>
      <textarea id="cRole" required placeholder="예: 당신은 제약회사의 2030 미래 직무를 설계하는 전문가입니다. ...">${esc(c.role || '')}</textarea>
      <label for="cHow">일하는 방식과 답변 형식 <span class="hint">어떤 순서로 생각하고 어떤 형식으로 답할지 적어 주세요. (선택)</span></label>
      <textarea id="cHow" placeholder="예: 먼저 현재 직무를 분류하고, 유지/전환/신설로 나눠 답합니다.">${esc(c.how || '')}</textarea>
      <div class="actions">
        <button class="send" type="submit">저장하고 채팅 시작</button>
        <a class="ghost-btn" href="#/" style="text-decoration:none;display:inline-block">취소</a>
      </div>
    </form>`;
  document.getElementById('cf').addEventListener('submit', e => {
    e.preventDefault();
    store.set('localStorage','hras.custom',{
      name: document.getElementById('cName').value.trim(),
      role: document.getElementById('cRole').value.trim(),
      how: document.getElementById('cHow').value.trim()
    });
    location.hash = '#/agent/custom';
  });
  document.getElementById('cName').focus();
}

/* =========================================================
   8. 설정 창
   ========================================================= */
const dlg = document.getElementById('settings');
function openSettings(){
  const s = getSettings();
  document.getElementById('sKey').value = s.apiKey;
  document.getElementById('sModel').value = s.model;
  document.getElementById('sProxy').value = s.proxyUrl;
  document.getElementById('sScenario').value = s.scenario;
  dlg.showModal();
}
document.getElementById('openSettings').addEventListener('click', openSettings);
document.getElementById('cancelSettings').addEventListener('click', () => dlg.close());
document.getElementById('settingsForm').addEventListener('submit', () => {
  store.set('localStorage','hras.settings',{
    apiKey: document.getElementById('sKey').value.trim(),
    model: document.getElementById('sModel').value.trim() || DEFAULTS.model,
    proxyUrl: document.getElementById('sProxy').value.trim(),
    scenario: document.getElementById('sScenario').value.trim()
  });
});
document.getElementById('clearChats').addEventListener('click', () => {
  if (!confirm('모든 전문가와의 대화 기록을 지울까요?')) return;
  chats = {}; saveChats(); notice = null;
  dlg.close();
  if (current) drawMsgs(current);
});

/* =========================================================
   9. 라우팅
   ========================================================= */
function route(){
  if (location.hash === '#/custom'){ renderCustomForm(); window.scrollTo(0, 0); return; }
  const m = location.hash.match(/^#\/agent\/([\w-]+)/);
  const a = m && getAgent(m[1]);
  if (m && m[1] === 'custom' && !a){ location.hash = '#/custom'; return; }
  a ? renderChat(a) : renderCatalog();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
